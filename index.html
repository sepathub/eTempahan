<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tempahan SKSE - Ceria (Online)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel untuk proses JSX dalam browser -->
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

    <!-- Import Map: Memastikan lucide-react menggunakan React luaran -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px; width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @media print {
            body { background-color: white !important; -webkit-print-color-adjust: exact; }
            .print\:hidden { display: none !important; }
            .print\:flex { display: flex !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Main React Code -->
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useMemo, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { createClient } from '@supabase/supabase-js';
        import { 
            ChevronLeft, ChevronRight, Calendar, Clock, User, BookOpen, Users, 
            MapPin, Printer, Plus, CheckCircle, X, BarChart2, LayoutGrid, 
            List, TrendingUp, Award, Trash2, Info,
            Monitor, Hammer, Moon, BookOpenText, Library, MonitorPlay, FlaskConical
        } from 'lucide-react';

        // --- KONFIGURASI SUPABASE ---
        const supabaseUrl = 'https://gfjaicqnjydwshpgtfbj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmamFpY3Fuanlkd3NocGd0ZmJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMDU5MjAsImV4cCI6MjA4MjY4MTkyMH0.MkXoum7DUdftR6JSYvJyPmwkdjUnlxg2t5fdORS1gXc';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const SCHOOL_NAME = "SEKOLAH KEBANGSAAN SIMPANG EMPAT";
        const LOGO_URL = "https://i.postimg.cc/W4vLfYrm/LOGO-SKSE-utk-background-putih-(2).jpg";
        
        const ROOMS = [
            { id: 'jqaf', name: 'Bilik J-Qaf', icon: BookOpenText, color: 'bg-emerald-100 border-emerald-300 text-emerald-800', activeColor: 'bg-emerald-500 text-white shadow-emerald-200', iconColor: 'text-emerald-600', barColor: 'bg-emerald-500', pastelBg: 'bg-emerald-50' },
            { id: 'pss', name: 'Pusat Sumber', icon: Library, color: 'bg-amber-100 border-amber-300 text-amber-800', activeColor: 'bg-amber-500 text-white shadow-amber-200', iconColor: 'text-amber-600', barColor: 'bg-amber-500', pastelBg: 'bg-amber-50' },
            { id: 'komputer', name: 'Makmal Komputer', icon: Monitor, color: 'bg-cyan-100 border-cyan-300 text-cyan-800', activeColor: 'bg-cyan-500 text-white shadow-cyan-200', iconColor: 'text-cyan-600', barColor: 'bg-cyan-500', pastelBg: 'bg-cyan-50' },
            { id: 'sains', name: 'Makmal Sains', icon: FlaskConical, color: 'bg-rose-100 border-rose-300 text-rose-800', activeColor: 'bg-rose-500 text-white shadow-rose-200', iconColor: 'text-rose-600', barColor: 'bg-rose-500', pastelBg: 'bg-rose-50' },
            { id: 'smart', name: 'Smartroom', icon: MonitorPlay, color: 'bg-fuchsia-100 border-fuchsia-300 text-fuchsia-800', activeColor: 'bg-fuchsia-500 text-white shadow-fuchsia-200', iconColor: 'text-fuchsia-600', barColor: 'bg-fuchsia-500', pastelBg: 'bg-fuchsia-50' },
            { id: 'rbt', name: 'Bilik RBT', icon: Hammer, color: 'bg-orange-100 border-orange-300 text-orange-800', activeColor: 'bg-orange-500 text-white shadow-orange-200', iconColor: 'text-orange-600', barColor: 'bg-orange-500', pastelBg: 'bg-orange-50' },
            { id: 'surau', name: 'Surau', icon: Moon, color: 'bg-teal-100 border-teal-300 text-teal-800', activeColor: 'bg-teal-500 text-white shadow-teal-200', iconColor: 'text-teal-600', barColor: 'bg-teal-500', pastelBg: 'bg-teal-50' },
        ];

        const DAYS = ['ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT'];
        const PERIODS = Array.from({ length: 12 }, (_, i) => i + 1);

        const CLASSES = [
            "1 Ikhlas", "1 Setia", "2 Maju", "2 Perkasa",
            "3 Naim", "3 Aktif", "4 Gigih", "4 Ehsan",
            "5 Mahir", "5 Pintar", "6 Arif", "6 Tekun",
            "PPKI ADN", "PPKI FIRDAUS", "PPKI MAWA", "PPKI RAYYAN"
        ];

        const SUBJECTS = [
            "SN", "BM", "BI", "BA", "MT", "PSV", 
            "P Mrl", "PAI", "TASMIK", "RBT", "SEJ", "P Mzk",
            "PJK", "Kelas Ganti"
        ];

        function App() {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [viewMode, setViewMode] = useState('weekly'); 
            const [selectedRoom, setSelectedRoom] = useState(ROOMS[0]);
            const [bookings, setBookings] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedSlot, setSelectedSlot] = useState(null); 
            const [formData, setFormData] = useState({ guru: '', kelas: CLASSES[0], subjek: SUBJECTS[0] });
            const [viewBooking, setViewBooking] = useState(null);

            const fetchBookings = async () => {
                setIsLoading(true);
                try {
                    const { data, error } = await supabase
                        .from('eTempahan')
                        .select('*');
                    
                    if (error) throw error;
                    setBookings(data || []);
                } catch (error) {
                    console.error('Ralat menarik data:', error);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchBookings();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.guru) {
                    alert("Sila masukkan nama guru.");
                    return;
                }

                const newBooking = {
                    room_id: selectedRoom.id,
                    date: selectedSlot.dateStr,
                    period: selectedSlot.period,
                    guru: formData.guru,
                    kelas: formData.kelas,
                    subjek: formData.subjek
                };

                const { error } = await supabase
                    .from('eTempahan')
                    .insert([newBooking]);

                if (error) {
                    alert("Gagal menyimpan: " + error.message);
                } else {
                    await fetchBookings();
                    setIsModalOpen(false);
                    setFormData({ guru: '', kelas: CLASSES[0], subjek: SUBJECTS[0] });
                }
            };

            const handleDeleteBooking = async () => {
                if (!viewBooking) return;

                if(confirm("Adakah anda pasti mahu membatalkan tempahan ini?")) {
                    const { error } = await supabase
                        .from('eTempahan')
                        .delete()
                        .eq('id', viewBooking.id);

                    if (error) {
                        alert("Gagal memadam tempahan.");
                    } else {
                        await fetchBookings();
                        setViewBooking(null);
                    }
                }
            };

            const getStartOfWeek = (date) => {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
                return new Date(d.setDate(diff));
            };

            const formatDate = (date) => {
                return date.toLocaleDateString('ms-MY', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const changeWeek = (weeks) => {
                const newDate = new Date(currentDate);
                newDate.setDate(newDate.getDate() + (weeks * 7));
                setCurrentDate(newDate);
            };

            const changeMonth = (months) => {
                const newDate = new Date(currentDate);
                newDate.setMonth(newDate.getMonth() + months);
                setCurrentDate(newDate);
            }

            const handleSlotClick = (dateStr, period, existingBooking) => {
                if (existingBooking) {
                    setViewBooking(existingBooking);
                } else {
                    setSelectedSlot({ dateStr, period });
                    setFormData(prev => ({ ...prev, guru: '' })); 
                    setIsModalOpen(true);
                }
            };

            const getBooking = (dateStr, period) => {
                return bookings.find(b => 
                    b.room_id === selectedRoom.id && 
                    b.date === dateStr && 
                    parseInt(b.period) === parseInt(period)
                );
            };

            const weekStart = getStartOfWeek(currentDate);
            const weekDates = DAYS.map((day, index) => {
                const d = new Date(weekStart);
                d.setDate(d.getDate() + index);
                return {
                    name: day,
                    dateObj: d,
                    dateStr: d.toISOString().split('T')[0],
                    formatted: formatDate(d)
                };
            });

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const days = [];
                const startPadding = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
                for (let i = 0; i < startPadding; i++) days.push(null);
                for (let i = 1; i <= lastDay.getDate(); i++) days.push(new Date(year, month, i));
                return days;
            };

            const monthlyDays = getDaysInMonth(currentDate);
            const currentMonthName = currentDate.toLocaleDateString('ms-MY', { month: 'long', year: 'numeric' });

            const stats = useMemo(() => {
                const roomCounts = {};
                const teacherCounts = {};
                const periodCounts = {};
                let totalBookings = bookings.length;

                ROOMS.forEach(r => roomCounts[r.id] = 0);
                PERIODS.forEach(p => periodCounts[p] = 0);

                bookings.forEach(b => {
                    if (roomCounts[b.room_id] !== undefined) roomCounts[b.room_id]++;
                    if (b.guru) teacherCounts[b.guru] = (teacherCounts[b.guru] || 0) + 1;
                    if (periodCounts[b.period] !== undefined) periodCounts[b.period]++;
                });

                const topTeachers = Object.entries(teacherCounts).sort(([,a], [,b]) => b - a).slice(0, 5);
                const popularPeriods = Object.entries(periodCounts).sort(([,a], [,b]) => b - a).slice(0, 5);
                
                return { roomCounts, topTeachers, popularPeriods, totalBookings, periodCounts };
            }, [bookings]);

            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 font-sans pb-20">
                    <header className="bg-gradient-to-r from-violet-600 via-purple-600 to-fuchsia-600 text-white shadow-xl print:hidden relative overflow-hidden">
                        <div className="container mx-auto px-4 py-6 relative z-10">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                                <div className="flex items-center gap-4">
                                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 object-contain bg-white rounded-full p-1" />
                                    <div className="text-center md:text-left">
                                        <h1 className="text-xl md:text-2xl font-extrabold uppercase">{SCHOOL_NAME}</h1>
                                        <span className="bg-white/20 px-2 py-0.5 rounded text-xs font-bold">Sistem Tempahan Ceria (Online)</span>
                                    </div>
                                </div>
                                
                                <div className="flex bg-white/20 p-1.5 rounded-2xl backdrop-blur-md border border-white/30">
                                    <button onClick={() => setViewMode('weekly')} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold ${viewMode === 'weekly' ? 'bg-white text-purple-700 shadow-md' : 'text-white'}`}><LayoutGrid size={18} /> Jadual</button>
                                    <button onClick={() => setViewMode('monthly')} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold ${viewMode === 'monthly' ? 'bg-white text-purple-700 shadow-md' : 'text-white'}`}><Calendar size={18} /> Kalendar</button>
                                    <button onClick={() => setViewMode('reports')} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold ${viewMode === 'reports' ? 'bg-white text-purple-700 shadow-md' : 'text-white'}`}><BarChart2 size={18} /> Laporan</button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto px-4 py-8 max-w-7xl">
                        {viewMode === 'weekly' && (
                            <div className="space-y-6">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4 print:hidden">
                                    <div className="flex items-center bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-white p-1.5">
                                        <button onClick={() => changeWeek(-1)} className="p-2 hover:bg-white rounded-xl text-purple-600"><ChevronLeft size={22}/></button>
                                        <span className="px-6 font-bold text-slate-700">{weekDates[0].formatted} - {weekDates[4].formatted}</span>
                                        <button onClick={() => changeWeek(1)} className="p-2 hover:bg-white rounded-xl text-purple-600"><ChevronRight size={22}/></button>
                                    </div>
                                    <button onClick={() => window.print()} className="flex items-center gap-2 bg-white px-5 py-2.5 rounded-xl border font-bold text-sm shadow-sm hover:bg-slate-50">
                                        <Printer size={18} /> Cetak Jadual
                                    </button>
                                </div>

                                <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar print:hidden">
                                    {ROOMS.map(room => (
                                        <button key={room.id} onClick={() => setSelectedRoom(room)} className={`flex flex-col items-center justify-center gap-2 min-w-[140px] h-32 rounded-3xl transition-all border-2 ${selectedRoom.id === room.id ? `${room.activeColor} border-white shadow-lg scale-105` : 'bg-white/60 border-white text-slate-500'}`}>
                                            <div className={`p-3 rounded-2xl ${selectedRoom.id === room.id ? 'bg-white/20' : room.pastelBg}`}>
                                                <room.icon size={28} className={selectedRoom.id === room.id ? 'text-white' : room.iconColor} />
                                            </div>
                                            <span className="font-bold text-xs px-2 text-center leading-tight">{room.name}</span>
                                        </button>
                                    ))}
                                </div>

                                <div className="bg-white/80 rounded-3xl shadow-xl overflow-hidden border border-white print:border-black">
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <table className="w-full min-w-[1000px] border-collapse">
                                            <thead>
                                                <tr className="bg-purple-50/50 border-b print:bg-slate-100">
                                                    <th className="p-5 text-left font-bold text-purple-900/70 text-xs tracking-wider sticky left-0 bg-purple-50">HARI / MASA</th>
                                                    {PERIODS.map(p => (
                                                        <th key={p} className="p-3 text-center border-r border-purple-50">
                                                            <div className="w-8 h-8 mx-auto rounded-lg bg-white border flex items-center justify-center text-xs font-bold">{p}</div>
                                                        </th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {weekDates.map((dayData) => (
                                                    <tr key={dayData.dateStr} className="border-b border-purple-50 hover:bg-white/40">
                                                        <td className="p-5 sticky left-0 bg-white/90 font-bold border-r">
                                                            <div className="text-slate-700">{dayData.name}</div>
                                                            <div className="text-[10px] text-purple-400 font-mono">{dayData.formatted}</div>
                                                        </td>
                                                        {PERIODS.map(period => {
                                                            const booking = getBooking(dayData.dateStr, period);
                                                            return (
                                                                <td key={`${dayData.dateStr}-${period}`} onClick={() => handleSlotClick(dayData.dateStr, period, booking)} className="p-1.5 border-r border-dashed border-purple-100/50 h-28 align-top cursor-pointer group">
                                                                    {booking ? (
                                                                        <div className={`h-full w-full rounded-xl p-2 text-[11px] flex flex-col gap-1 shadow-sm border border-white/20 ${selectedRoom.color}`}>
                                                                            <div className="font-bold truncate border-b border-current/10 pb-1 mb-0.5">{booking.subjek}</div>
                                                                            <div className="truncate opacity-90">{booking.kelas}</div>
                                                                            <div className="truncate font-semibold mt-auto pt-1 flex items-center gap-1 opacity-70">
                                                                                <User size={10}/> {booking.guru}
                                                                            </div>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="h-full w-full rounded-xl flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 bg-purple-50/50 border-2 border-dashed border-purple-200 transition-all">
                                                                            <Plus className="text-purple-300" size={16} />
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {viewMode === 'monthly' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm border">
                                    <button onClick={() => changeMonth(-1)} className="p-2 bg-slate-50 rounded-xl hover:bg-purple-50 transition"><ChevronLeft/></button>
                                    <h2 className="text-2xl font-extrabold text-slate-800 uppercase">{currentMonthName}</h2>
                                    <button onClick={() => changeMonth(1)} className="p-2 bg-slate-50 rounded-xl hover:bg-purple-50 transition"><ChevronRight/></button>
                                </div>
                                <div className="bg-white rounded-3xl shadow-lg border p-4">
                                    <div className="grid grid-cols-7 mb-4">
                                        {['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'].map(d => (
                                            <div key={d} className="text-center font-bold text-slate-400 text-[10px] uppercase tracking-widest">{d}</div>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-7 auto-rows-[120px] gap-2">
                                        {monthlyDays.map((day, idx) => {
                                            if (!day) return <div key={`pad-${idx}`}></div>;
                                            const dateStr = day.toISOString().split('T')[0];
                                            const dayBookings = bookings.filter(b => b.date === dateStr);
                                            const isToday = dateStr === new Date().toISOString().split('T')[0];
                                            const isWeekend = day.getDay() === 0 || day.getDay() === 6;
                                            return (
                                                <div key={dateStr} onClick={() => { if(!isWeekend) { setCurrentDate(day); setViewMode('weekly'); }}} className={`rounded-2xl p-2 border transition-all ${isWeekend ? 'bg-slate-50 text-slate-300 border-transparent' : 'bg-white cursor-pointer hover:border-purple-300 hover:shadow-md'} ${isToday ? 'ring-2 ring-purple-400' : 'border-slate-100'}`}>
                                                    <span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${isToday ? 'bg-purple-600 text-white' : 'text-slate-500'}`}>{day.getDate()}</span>
                                                    <div className="mt-2 space-y-1">
                                                        {dayBookings.length > 0 && <div className="text-[9px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded-md font-bold text-center">{dayBookings.length} Tempahan</div>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {viewMode === 'reports' && (
                            <div className="space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border flex items-center gap-4">
                                        <div className="p-4 bg-blue-50 text-blue-600 rounded-2xl"><BookOpen size={32}/></div>
                                        <div><p className="text-slate-400 text-[10px] font-bold uppercase">Jumlah Tempahan</p><h3 className="text-2xl font-black">{stats.totalBookings}</h3></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border flex items-center gap-4">
                                        <div className="p-4 bg-pink-50 text-pink-600 rounded-2xl"><Award size={32}/></div>
                                        <div><p className="text-slate-400 text-[10px] font-bold uppercase">Guru Paling Aktif</p><h3 className="text-lg font-black leading-tight">{stats.topTeachers[0]?.[0] || '-'}</h3></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border flex items-center gap-4">
                                        <div className="p-4 bg-orange-50 text-orange-600 rounded-2xl"><Clock size={32}/></div>
                                        <div><p className="text-slate-400 text-[10px] font-bold uppercase">Waktu Puncak</p><h3 className="text-2xl font-black">Masa {stats.popularPeriods[0]?.[0] || '-'}</h3></div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border">
                                        <h3 className="text-lg font-bold mb-6 flex items-center gap-2"><BarChart2 size={20}/> Penggunaan Bilik</h3>
                                        <div className="space-y-5">
                                            {ROOMS.map(room => {
                                                const count = stats.roomCounts[room.id] || 0;
                                                const percentage = stats.totalBookings > 0 ? (count / stats.totalBookings) * 100 : 0;
                                                return (
                                                    <div key={room.id}>
                                                        <div className="flex justify-between text-xs font-bold mb-1"><span>{room.name}</span><span>{count}</span></div>
                                                        <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                                            <div className={`h-full ${room.barColor}`} style={{ width: `${percentage}%` }}></div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border">
                                        <h3 className="text-lg font-bold mb-6 flex items-center gap-2"><List size={20}/> Top 5 Guru Cemerlang</h3>
                                        <div className="space-y-3">
                                            {stats.topTeachers.map(([name, count], idx) => (
                                                <div key={name} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                                                    <span className="text-sm font-bold">{idx + 1}. {name}</span>
                                                    <span className="bg-purple-100 text-purple-700 px-3 py-1 rounded-lg text-[10px] font-bold">{count} Sesi</span>
                                                </div>
                                            ))}
                                            {stats.topTeachers.length === 0 && <p className="text-slate-400 italic text-center text-sm py-10">Tiada data direkodkan.</p>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className="bg-gradient-to-r from-violet-600 to-fuchsia-600 p-6 text-white flex justify-between items-start">
                                    <div>
                                        <h3 className="text-xl font-black flex items-center gap-2"><Calendar size={24} /> Tempahan Baru</h3>
                                        <p className="text-purple-100 text-xs mt-1">{selectedRoom.name} • Masa {selectedSlot?.period}</p>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-white/20 p-2 rounded-full hover:bg-white/30 transition"><X size={20} /></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-8 space-y-5">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-500 uppercase">Nama Guru <span className="text-red-500">*</span></label>
                                        <input type="text" required placeholder="Contoh: Cikgu Ahmad" className="w-full px-4 py-3 border-2 rounded-2xl focus:border-purple-500 outline-none font-bold" value={formData.guru} onChange={(e) => setFormData({...formData, guru: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-500 uppercase">Kelas</label>
                                            <select className="w-full px-4 py-3 border-2 rounded-2xl outline-none font-bold" value={formData.kelas} onChange={(e) => setFormData({...formData, kelas: e.target.value})}>
                                                {CLASSES.map(cls => <option key={cls} value={cls}>{cls}</option>)}
                                            </select>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-500 uppercase">Subjek</label>
                                            <select className="w-full px-4 py-3 border-2 rounded-2xl outline-none font-bold" value={formData.subjek} onChange={(e) => setFormData({...formData, subjek: e.target.value})}>
                                                {SUBJECTS.map(sub => <option key={sub} value={sub}>{sub}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-4 flex gap-3">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-3 text-slate-500 font-bold border rounded-2xl hover:bg-slate-50">Batal</button>
                                        <button type="submit" className="flex-[2] py-3 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white rounded-2xl font-bold shadow-lg hover:shadow-purple-200 transition active:scale-95">Sahkan Tempahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {viewBooking && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className={`p-6 text-white flex justify-between items-start ${ROOMS.find(r => r.id === viewBooking.room_id)?.activeColor.split(' ')[0]}`}>
                                    <div><h3 className="text-xl font-black">Butiran Tempahan</h3><p className="text-white/80 text-xs">Maklumat slot yang telah ditempah.</p></div>
                                    <button onClick={() => setViewBooking(null)} className="bg-white/20 p-2 rounded-full hover:bg-white/30 transition"><X size={20} /></button>
                                </div>
                                <div className="p-8 space-y-6">
                                    <div className="bg-slate-50 p-4 rounded-2xl space-y-3">
                                        <div className="flex justify-between border-b pb-2">
                                            <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Guru</span>
                                            <span className="font-bold text-slate-700">{viewBooking.guru}</span>
                                        </div>
                                        <div className="flex justify-between border-b pb-2">
                                            <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Kelas / Subjek</span>
                                            <span className="font-bold text-slate-700">{viewBooking.kelas} • {viewBooking.subjek}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Masa</span>
                                            <span className="font-bold text-slate-700">Masa {viewBooking.period} ({formatDate(new Date(viewBooking.date))})</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => setViewBooking(null)} className="flex-1 py-3 text-slate-500 font-bold border rounded-2xl">Tutup</button>
                                        <button onClick={handleDeleteBooking} className="flex-[2] py-3 bg-red-50 text-red-600 rounded-2xl font-bold hover:bg-red-600 hover:text-white transition flex items-center justify-center gap-2">
                                            <Trash2 size={16} /> Batalkan Tempahan
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
